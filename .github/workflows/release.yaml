name: Release

# Pushing a tag such as v1.0.0 or v1.0.0-beta1 makes a GitHub release with
# both clicks (a pre-release for alpha, beta and rc). The tag has to match the
# version in CMakeLists.txt; the clicks are then 1.0.0 or 1.0.0~beta1 (see
# CMakeLists.txt).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Before the long build: the tag and the version must agree.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: |
          version=$(sed -n 's/^project(disports VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          case "$GITHUB_REF_NAME" in
            "v$version"|"v$version"-*) ;;
            *) echo "::error::The tag is $GITHUB_REF_NAME but CMakeLists.txt says $version"; exit 1 ;;
          esac
          if ! echo "$GITHUB_REF_NAME" | grep -qE '^v[0-9.]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::After the version, a tag may only have -beta1 and the like"
            exit 1
          fi

  build:
    needs: version
    uses: ./.github/workflows/build.yaml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: clicks
          merge-multiple: true

      # The clicks must carry the release's version (v1.0.0-beta1 is
      # 1.0.0~beta1), not a commit.
      - name: Check the clicks
        run: |
          version=${GITHUB_REF_NAME#v}
          version=${version/-/\~}
          # Each comes in its build folders (<arch>/app/), all in one place.
          find clicks -mindepth 2 -name '*.click' -exec mv -t clicks {} +
          ls clicks/*.click
          for click in clicks/*.click; do
            case "$(basename "$click")" in
              disports.jukfiuu_${version}_*.click) ;;
              *) echo "::error::$(basename "$click") isn't version $version"; exit 1 ;;
            esac
          done

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: clicks/*.click

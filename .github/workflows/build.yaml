name: Build

# The clicks for both architectures, on every push and pull request. The
# release workflow (release.yaml) builds with this too.

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'LICENSE', 'tools/test/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        arch: [arm64, amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # The tags, to tell a release build from a dev build.
          fetch-depth: 0

      # Rebuilding WebRTC, Abseil and the rest from scratch takes a while.
      - uses: actions/cache@v6
        with:
          path: build
          key: build-${{ matrix.arch }}-${{ hashFiles('.gitmodules', 'clickable.yaml', 'third_party/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: build-${{ matrix.arch }}-${{ hashFiles('.gitmodules', 'clickable.yaml', 'third_party/CMakeLists.txt') }}-

      - name: Build
        run: |
          rm -f build/*/app/*.click
          docker run --rm --volume "$PWD":/app --workdir /app \
            clickable/ci-ut24.04-2.x-${{ matrix.arch }}:8 \
            clickable build --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: disports-${{ matrix.arch }}
          path: build/*/app/*.click
          if-no-files-found: error
          retention-days: 30
